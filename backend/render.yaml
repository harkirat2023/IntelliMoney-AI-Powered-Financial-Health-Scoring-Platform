services:
  - type: web
    name: intellimoney-api
    runtime: python
    rootDir: backend
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_NAME
        value: IntelliMoney
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: IntelliMoney
      - key: REDIS_URL
        sync: false
      - key: BANK_ENCRYPTION_KEY
        sync: false
      - key: BANK_CONSENT_REDIRECT_BASE
        value: https://intellimoney.vercel.app/connect-bank/consent
      - key: CORS_ORIGINS
        value: https://intellimoney.vercel.app,http://localhost:5173
      - key: LOG_LEVEL
        value: INFO
      - key: CLERK_FRONTEND_API
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_AUTHORIZED_PARTIES
        value: https://intellimoney.vercel.app,http://localhost:5173
      - key: SETU_CLIENT_ID
        sync: false
      - key: SETU_CLIENT_SECRET
        sync: false
      - key: SETU_PRODUCT_INSTANCE_ID
        sync: false
      - key: SETU_ENVIRONMENT
        value: sandbox
      - key: AA_ALLOW_DEMO_FALLBACK
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
